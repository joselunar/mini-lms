services:
  mysql:
    image: mysql:8.0
    container_name: mini-lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mini_lms
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: mini-lms-app
    ports:
      - "8081:8080"
    environment:
      CI_ENVIRONMENT: development
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  mysql_data:
